services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Descomenta y define para persistir solicitudes en Postgres:
      # DATABASE_URL: postgres://user:pass@host:5432/db
      PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/onboarding/"]
      interval: 5s
      timeout: 3s
      retries: 10
