services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Se toman del shell o del archivo .env del proyecto
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      SANCTIONS_SCREENING: ${SANCTIONS_SCREENING:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/onboarding/"]
      interval: 5s
      timeout: 3s
      retries: 10
